# Netlify Configuration for Bank Credit Analysis & Loan Recommendation System

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional: Proxy API requests to your deployed backend (e.g. on Render or Railway)
# [[redirects]]
#   from = "/api/*"
#   to = "https://aicreditfinder-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
