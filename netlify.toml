# Netlify Configuration for Bank Credit Analysis & Loan Recommendation System

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to your deployed backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://aicreditfinder.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
